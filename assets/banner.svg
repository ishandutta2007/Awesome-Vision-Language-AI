<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#080C1A"/></linearGradient><radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".3"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/></radialGradient><radialGradient id="purpleGlow" cx="80%" cy="40%" r="60%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#F472B6"/></linearGradient><linearGradient id="laserGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/><stop offset="50%" stop-color="#38BDF8" stop-opacity=".8"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1E293B" stroke-opacity=".5" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><filter id="shadow" width="120%" height="140%" x="-10%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".7" stdDeviation="6"/></filter><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}@keyframes scanline{0%{transform:translateY(0);opacity:0}15%,85%{opacity:.75}}@keyframes waveMotion{0%{stroke-dashoffset:0}}@keyframes floatParticle{0%{transform:translate(0,0)}50%{transform:translate(15px,-15px)}}.anim-glow-1{animation:pulseGlow 6s ease-in-out infinite alternate;transform-origin:240px 120px}.anim-glow-2{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:960px 160px}.anim-scan{animation:scanline 5s cubic-bezier(.4,0,.2,1) infinite}.anim-wave{stroke-dasharray:8 12;animation:waveMotion 4s linear infinite}.anim-float-a{animation:floatParticle 5s ease-in-out infinite}.anim-float-b{animation:floatParticle 6s ease-in-out infinite reverse}</style></defs><rect width="1200" height="380" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5" rx="16"/><ellipse cx="240" cy="120" fill="url(#cyanGlow)" class="anim-glow-1" rx="340" ry="200"/><ellipse cx="960" cy="160" fill="url(#purpleGlow)" class="anim-glow-2" rx="360" ry="220"/><rect width="1200" height="380" fill="url(#gridPattern)" rx="16"/><g class="anim-scan"><rect width="1200" height="3" x="0" y="30" fill="url(#laserGrad)"/></g><g opacity=".35"><path fill="none" stroke="#38BDF8" stroke-width="1.5" d="M 120 70 Q 300 180 500 120 T 900 150 T 1120 80" class="anim-wave"/><path fill="none" stroke="#A855F7" stroke-width="1.5" d="M 80 320 Q 350 200 600 280 T 950 240 T 1140 310" class="anim-wave"/><circle cx="210" cy="90" r="4" fill="#38BDF8" class="anim-float-a"/><circle cx="980" cy="90" r="4" fill="#F472B6" class="anim-float-b"/><circle cx="1080" cy="270" r="4.5" fill="#A855F7" class="anim-float-a"/><circle cx="150" cy="290" r="3.5" fill="#06B6D4" class="anim-float-b"/></g><g id="foreground" filter="url(#shadow)"><g transform="translate(455, 42)"><rect width="290" height="32" fill="#1E293B" fill-opacity=".8" stroke="#475569" stroke-width="1" rx="16"/><circle cx="20" cy="16" r="6" fill="#10B981" filter="url(#glowFilter)"/><text x="35" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED KNOWLEDGE BASE</text></g><text x="600" y="145" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1" text-anchor="middle">Awesome Vision-Language AI</text><text x="600" y="195" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" letter-spacing=".2" text-anchor="middle">Multimodal LLMs • Vision-Language Models • Visual QA • CLIP &amp; Zero-Shot Encoders</text><text x="600" y="232" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="middle">The authoritative guide to production-grade multimodal APIs, open-source weights, and computer vision ecosystems</text><g><g transform="translate(180, 280) translate(0, 0)"><rect width="180" height="38" fill="#0F172A" fill-opacity=".85" stroke="#38BDF8" stroke-width="1.2" rx="10"/><text x="90" y="24" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">👁️ Frontier VLMs</text></g><g transform="translate(180, 280) translate(200, 0)"><rect width="195" height="38" fill="#0F172A" fill-opacity=".85" stroke="#818CF8" stroke-width="1.2" rx="10"/><text x="97" y="24" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Open-Source Weights</text></g><g transform="translate(180, 280) translate(415, 0)"><rect width="215" height="38" fill="#0F172A" fill-opacity=".85" stroke="#A855F7" stroke-width="1.2" rx="10"/><text x="107" y="24" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔮 Contrastive Encoders</text></g><g transform="translate(180, 280) translate(650, 0)"><rect width="190" height="38" fill="#0F172A" fill-o