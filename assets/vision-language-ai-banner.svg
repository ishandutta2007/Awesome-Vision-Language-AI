<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C1A" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <!-- Drop Shadow Filter for Text & Pills -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.75; }
        85% { opacity: 0.75; }
        100% { transform: translateY(320px); opacity: 0; }
      }
      @keyframes waveMotion {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 120; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(15px, -15px); }
      }
      .anim-glow-1 {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: 240px 120px;
      }
      .anim-glow-2 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 960px 160px;
      }
      .anim-scan {
        animation: scanline 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .anim-wave {
        stroke-dasharray: 8 12;
        animation: waveMotion 4s linear infinite;
      }
      .anim-float-a {
        animation: floatParticle 5s ease-in-out infinite;
      }
      .anim-float-b {
        animation: floatParticle 6s ease-in-out infinite reverse;
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5" />

  <!-- Background Dynamic Glows -->
  <ellipse cx="240" cy="120" rx="340" ry="200" fill="url(#cyanGlow)" class="anim-glow-1" />
  <ellipse cx="960" cy="160" rx="360" ry="220" fill="url(#purpleGlow)" class="anim-glow-2" />

  <!-- Grid Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Animated Scanline (stays in background) -->
  <g class="anim-scan">
    <rect x="0" y="30" width="1200" height="3" fill="url(#laserGrad)" />
  </g>

  <!-- Subtle Dynamic Neural Network / Vision Rays in Background -->
  <g opacity="0.35">
    <!-- Vision Ray Lines -->
    <path d="M 120 70 Q 300 180 500 120 T 900 150 T 1120 80" fill="none" stroke="#38BDF8" stroke-width="1.5" class="anim-wave" />
    <path d="M 80 320 Q 350 200 600 280 T 950 240 T 1140 310" fill="none" stroke="#A855F7" stroke-width="1.5" class="anim-wave" />

    <!-- Ambient Visual Nodes -->
    <circle cx="210" cy="90" r="4" fill="#38BDF8" class="anim-float-a" />
    <circle cx="980" cy="90" r="4" fill="#F472B6" class="anim-float-b" />
    <circle cx="1080" cy="270" r="4.5" fill="#A855F7" class="anim-float-a" />
    <circle cx="150" cy="290" r="3.5" fill="#06B6D4" class="anim-float-b" />
  </g>

  <!-- FOREGROUND LAYER: Badges, Title, Subtitle, and Pills (Guaranteed Top Z-Index & Clear Contrast) -->
  <g id="foreground" filter="url(#shadow)">
    <!-- Top Pill: Ecosystem Tag -->
    <g transform="translate(455, 42)">
      <rect width="290" height="32" rx="16" fill="#1E293B" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="16" r="6" fill="#10B981" filter="url(#glowFilter)" />
      <text x="35" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED KNOWLEDGE BASE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">
      Awesome Vision-Language AI
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#E2E8F0" letter-spacing="0.2">
      Multimodal LLMs • Vision-Language Models • Visual QA • CLIP &amp; Zero-Shot Encoders
    </text>

    <!-- Feature Description -->
    <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      The authoritative guide to production-grade multimodal APIs, open-source weights, and computer vision ecosystems
    </text>

    <!-- Interactive / Status Pills in Bottom Row -->
    <g transform="translate(180, 280)">
      <!-- Pill 1: Frontier VLMs -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1.2" />
        <text x="90" y="24" text-anchor="middle" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">👁️ Frontier VLMs</text>
      </g>

      <!-- Pill 2: Open Weights -->
      <g transform="translate(200, 0)">
        <rect width="195" height="38" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#818CF8" stroke-width="1.2" />
        <text x="97" y="24" text-anchor="middle" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open-Source Weights</text>
      </g>

      <!-- Pill 3: Encoders & CLIP -->
      <g transform="translate(415, 0)">
        <rect width="215" height="38" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#A855F7" stroke-width="1.2" />
        <text x="107" y="24" text-anchor="middle" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔮 Contrastive Encoders</text>
      </g>

      <!-- Pill 4: Production Serving -->
      <g transform="translate(650, 0)">
        <rect width="190" height="38" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#F43F5E" stroke-width="1.2" />
        <text x="95" y="24" text-anchor="middle" fill="#FECDD3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 Low-Latency Serving</text>
      </g>
    </g>
  </g>
</svg>
